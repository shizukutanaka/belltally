<!DOCTYPE html>
<!-- BELLTALLY-APP -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BellTally — ベルマーク集計カウンター</title>
<style>
  :root { --accent:#1a7f4b; --accent-dark:#146239; --warn:#b3261e; }
  * { box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
         margin: 0; background:#f4f6f4; color:#222; }
  header { background: var(--accent); color:#fff; padding: 12px 16px;
           display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; }
  header h1 { font-size: 20px; margin: 0; }
  header .total { font-size: 18px; font-weight: bold; margin-left:auto; }
  main { max-width: 960px; margin: 0 auto; padding: 12px; }
  section { background:#fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h2 { font-size: 16px; margin: 4px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  button { font: inherit; cursor: pointer; border: 1px solid #c9d4c9; background:#fff;
           border-radius: 8px; padding: 10px 8px; }
  button:hover { border-color: var(--accent); }
  button.selected { background: var(--accent); color:#fff; border-color: var(--accent-dark); }
  .company .num { font-size: 20px; font-weight: bold; margin-right: 6px; }
  .company .note { display:block; font-size: 11px; color:#a33; }
  button.selected .note { color:#ffd9d4; }
  .company .cnt { display:block; font-size: 12px; opacity:.85; }
  .points { display:flex; flex-wrap:wrap; gap:8px; }
  .points button { min-width: 64px; font-size: 18px; }
  .counter { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .counter .now { font-size: 18px; }
  .counter .now b { font-size: 34px; }
  .counter button { font-size: 22px; padding: 14px 22px; min-width: 96px; }
  .counter button.plus { background: var(--accent); color:#fff; border-color: var(--accent-dark); }
  input[type=number], input[type=text] { font: inherit; padding: 8px; border:1px solid #c9d4c9; border-radius:8px; width: 7em; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #d5ddd5; padding: 6px 8px; text-align: right; }
  th { background:#eef4ee; }
  td.name, th.name { text-align: left; }
  tr.subtotal td { background:#f4f8f4; font-weight: bold; }
  tr.grand td { background:#e2efe2; font-weight: bold; font-size: 17px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .actions button { padding: 10px 16px; }
  button.danger { color: var(--warn); border-color: var(--warn); }
  .msg { color: var(--warn); min-height: 1.2em; }
  .kbd-hint { font-size: 12px; color:#666; }
  #keybuf { font-weight: bold; color: var(--accent-dark); }
  @media print {
    .no-print, header .total { display: none !important; }
    body { background:#fff; }
    section { box-shadow:none; }
  }
</style>
</head>
<body>
<header>
  <h1>BellTally — ベルマーク集計カウンター</h1>
  <div class="total">総合計: <span id="grand-count">0</span> 枚 / <span id="grand-points">0</span> 点</div>
</header>
<main>
  <section class="no-print">
    <h2>1. 会社を選ぶ</h2>
    <div class="grid" id="companies"></div>
    <p>
      番号で直接選ぶ:
      <input type="number" id="company-input" min="1" max="99" placeholder="例: 7">
      <button id="company-go">選ぶ</button>
      <span class="kbd-hint">（マスタに無い番号も数えられます）</span>
    </p>
    <p class="kbd-hint">キーボード: 数字キーで番号を入力し Enter で会社を選択 / 「+」で+1（Shift同時で+10）/ 「-」で−1
      <span id="keybuf"></span></p>
  </section>

  <section class="no-print">
    <h2>2. 点数を選ぶ</h2>
    <div class="points" id="points"></div>
    <p>その他の点数:
      <input type="number" id="points-input" min="0.5" step="0.5" placeholder="例: 7.5">
      <button id="points-go">この点数にする</button>
    </p>
  </section>

  <section class="no-print">
    <h2>3. 数える</h2>
    <div class="counter">
      <div class="now"><span id="now-label">会社と点数を選んでください</span><br>
        現在 <b id="now-count">0</b> 枚</div>
      <button id="minus" aria-label="1枚減らす">−1</button>
      <button id="plus1" class="plus" aria-label="1枚増やす">+1</button>
      <button id="plus10" class="plus" aria-label="10枚増やす">+10</button>
    </div>
    <p class="msg" id="msg"></p>
  </section>

  <section id="summary-section">
    <h2>集計結果（会社別・点数別）</h2>
    <table id="summary">
      <thead><tr><th>企業番号</th><th class="name">会社名</th><th>点数</th><th>枚数</th><th>点数小計</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="actions no-print" style="margin-top:12px">
      <button id="print">印刷する</button>
      <button id="csv">CSVをダウンロード</button>
      <button id="clear" class="danger">すべて消去</button>
    </p>
  </section>
  <p class="kbd-hint no-print">データはこのパソコンの中（BellTally のデータフォルダの belltally.json）にだけ保存されます。外部に送信されることはありません。</p>
</main>
<script>
"use strict";
const POINT_PRESETS = [0.5, 1, 1.5, 2, 2.5, 3, 4, 5, 10, 20, 30, 50];
let state = null;
let selCompany = null;   // canonical company number
let selPoints = null;    // points as float, multiple of 0.5
let keyBuf = "";

const $ = id => document.getElementById(id);

async function load() {
  const r = await fetch("/api/state");
  state = await r.json();
  render();
}

function fmtHalf(h) { return h % 2 === 0 ? String(h / 2) : (h / 2 - 0.5) + ".5"; }

function currentCount() {
  if (selCompany === null || selPoints === null || !state) return 0;
  const half = Math.round(selPoints * 2);
  for (const e of state.entries) {
    if (e.company === selCompany && e.points_half === half) return e.count;
  }
  return 0;
}

function render() {
  // company grid
  const grid = $("companies");
  grid.innerHTML = "";
  for (const c of state.companies) {
    const canon = c.merged_into || c.number;
    const b = document.createElement("button");
    b.className = "company" + (selCompany === canon ? " selected" : "");
    let counted = 0;
    for (const p of (c.points || [])) counted += p.count;
    b.innerHTML = "";
    const num = document.createElement("span"); num.className = "num"; num.textContent = c.number;
    b.appendChild(num);
    b.appendChild(document.createTextNode(c.name));
    if (c.note) { const n = document.createElement("span"); n.className = "note"; n.textContent = c.note; b.appendChild(n); }
    if (counted > 0) { const s = document.createElement("span"); s.className = "cnt"; s.textContent = "集計中: " + counted + " 枚"; b.appendChild(s); }
    b.addEventListener("click", () => selectCompany(c.number));
    grid.appendChild(b);
  }
  // points presets
  const prow = $("points");
  prow.innerHTML = "";
  for (const p of POINT_PRESETS) {
    const b = document.createElement("button");
    b.textContent = fmtHalf(Math.round(p * 2)) + " 点";
    if (selPoints === p) b.className = "selected";
    b.addEventListener("click", () => { selPoints = p; render(); });
    prow.appendChild(b);
  }
  // counter area
  if (selCompany !== null && selPoints !== null) {
    const c = state.companies.find(x => (x.merged_into || x.number) === selCompany);
    const name = c ? c.name : "（マスタ未登録）";
    $("now-label").textContent = selCompany + " 番 " + name + " / " + fmtHalf(Math.round(selPoints * 2)) + " 点";
  } else {
    $("now-label").textContent = "会社と点数を選んでください";
  }
  $("now-count").textContent = currentCount();
  // summary
  const tb = $("summary").querySelector("tbody");
  tb.innerHTML = "";
  for (const d of state.summary.companies) {
    for (const r of d.rows) {
      const tr = document.createElement("tr");
      tr.innerHTML = "";
      for (const [v, cls] of [[d.company, ""], [d.name, "name"], [r.points, ""], [r.count, ""], [r.subtotal, ""]]) {
        const td = document.createElement("td");
        if (cls) td.className = cls;
        td.textContent = v;
        tr.appendChild(td);
      }
      tb.appendChild(tr);
    }
    const tr = document.createElement("tr");
    tr.className = "subtotal";
    tr.innerHTML = "";
    const cells = [[d.company, ""], [d.name + " 合計", "name"], ["", ""], [d.total_count, ""], [d.total_points, ""]];
    for (const [v, cls] of cells) {
      const td = document.createElement("td");
      if (cls) td.className = cls;
      td.textContent = v;
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
  const gtr = document.createElement("tr");
  gtr.className = "grand";
  gtr.innerHTML = "";
  for (const [v, cls] of [["", ""], ["総合計", "name"], ["", ""], [state.summary.total_count, ""], [state.summary.total_points, ""]]) {
    const td = document.createElement("td");
    if (cls) td.className = cls;
    td.textContent = v;
    gtr.appendChild(td);
  }
  tb.appendChild(gtr);
  $("grand-count").textContent = state.summary.total_count;
  $("grand-points").textContent = state.summary.total_points;
}

function selectCompany(num) {
  if (!Number.isInteger(num) || num < 1 || num > 99) { showMsg("企業番号は1〜99で指定してください"); return; }
  const c = state.companies.find(x => x.number === num);
  selCompany = c && c.merged_into ? c.merged_into : num;
  showMsg(c && c.merged_into ? num + " 番は " + c.merged_into + " 番（" + c.name + "）に集計されます" : "");
  render();
}

function showMsg(m) { $("msg").textContent = m || ""; }

async function count(delta) {
  if (selCompany === null || selPoints === null) { showMsg("先に会社と点数を選んでください"); return; }
  const r = await fetch("/api/count", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ company: selCompany, points: selPoints, delta })
  });
  if (!r.ok) { showMsg(await r.text()); return; }
  state = await r.json();
  showMsg("");
  render();
}

$("company-go").addEventListener("click", () => selectCompany(parseInt($("company-input").value, 10)));
$("company-input").addEventListener("keydown", e => {
  if (e.key === "Enter") selectCompany(parseInt($("company-input").value, 10));
});
$("points-go").addEventListener("click", () => {
  const v = parseFloat($("points-input").value);
  if (v > 0 && Math.round(v * 2) === v * 2) { selPoints = v; showMsg(""); render(); }
  else showMsg("点数は0.5点刻みで入力してください");
});
$("minus").addEventListener("click", () => count(-1));
$("plus1").addEventListener("click", () => count(1));
$("plus10").addEventListener("click", () => count(10));
$("print").addEventListener("click", () => window.print());
$("csv").addEventListener("click", () => { location.href = "/api/export.csv"; });
$("clear").addEventListener("click", async () => {
  if (!confirm("集計をすべて消去します。よろしいですか？")) return;
  const r = await fetch("/api/clear", { method: "POST" });
  state = await r.json();
  render();
});

document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (e.key >= "0" && e.key <= "9") {
    keyBuf += e.key;
    $("keybuf").textContent = "番号入力中: " + keyBuf + "（Enterで選択）";
  } else if (e.key === "Enter" && keyBuf) {
    selectCompany(parseInt(keyBuf, 10));
    keyBuf = "";
    $("keybuf").textContent = "";
  } else if (e.key === "Escape") {
    keyBuf = "";
    $("keybuf").textContent = "";
  } else if (e.key === "+") {
    count(e.shiftKey ? 10 : 1);
  } else if (e.key === "-") {
    count(-1);
  }
});

load();
</script>
</body>
</html>
